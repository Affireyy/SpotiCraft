plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	maven { url = 'https://maven.shedaniel.me/' }
}

loom {
	splitEnvironmentSourceSets()
	mods {
		'spoticraft' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

def modVersion = project.mod_version
version = modVersion
group = project.maven_group

processResources {
	inputs.property 'version', modVersion
	filesMatching('fabric.mod.json') {
		expand 'version': modVersion
	}
}

base {
	archivesName = 'spoticraft'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}
